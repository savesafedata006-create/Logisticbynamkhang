<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Driver Portal — MCK Logistics</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&family=Kanit:wght@500;600;700&display=swap');
body { font-family: 'Sarabun', sans-serif; background: #f8fafc; }
.kanit { font-family: 'Kanit', sans-serif; }
.status-card { border-left: 6px solid; }
</style>
</head>
<body class="pb-20">
  <!-- Top Bar -->
  <nav class="bg-slate-900 text-white p-4 sticky top-0 z-50 shadow-md">
    <div class="flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-orange-500 rounded-full flex items-center justify-center font-bold text-lg kanit">DR</div>
        <div>
          <p class="text-xs text-slate-400">พนักงานขับรถ</p>
          <p class="font-bold text-sm kanit" id="driver-name">นายประสิทธ์พร สุขสม</p>
        </div>
      </div>
      <button onclick="logout()" class="text-slate-400 hover:text-white"><i class="fas fa-sign-out-alt text-xl"></i></button>
      <button onclick="window.history.back()" class="text-slate-400 hover:text-white ml-2"><i class="fas fa-arrow-left text-xl"></i></button>
    </div>
  </nav>

  <div class="p-4 space-y-6">
    <!-- Dashboard Stats -->
    <div class="grid grid-cols-2 gap-3">
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
        <p class="text-[10px] font-bold text-slate-400 uppercase">งานวันนี้</p>
        <p class="text-2xl font-bold text-blue-600 kanit" id="count-jobs">1</p>
      </div>
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
        <p class="text-[10px] font-bold text-slate-400 uppercase">ประหยัดน้ำมัน</p>
        <p class="text-2xl font-bold text-green-600 kanit">3.15 <span class="text-xs">km/L</span></p>
      </div>

      <!-- Check-in Row -->
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 col-span-2">
        <div class="flex justify-between items-center">
          <div>
            <p class="text-[10px] font-bold text-slate-400 uppercase">สถานะการเข้างาน</p>
            <p class="text-sm font-bold text-slate-700 kanit" id="checkin-status">ยังไม่ได้เช็คอิน</p>
          </div>
          <button onclick="doCheckin()" id="btn-checkin" class="bg-green-600 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-md">
            <i class="fas fa-map-marker-alt mr-1"></i> เช็คอินเข้างาน
          </button>
        </div>
      </div>
    </div>

    <!-- Current Job -->
    <div id="active-job-container">
      <h3 class="font-bold text-slate-800 mb-3 flex items-center gap-2">
        <i class="fas fa-truck-moving text-orange-500"></i> งานที่กำลังดำเนินการ
      </h3>
      <div id="job-card" class="bg-white rounded-3xl shadow-lg border-t-8 border-orange-500 overflow-hidden">
        <!-- Content Rendered by JS -->
        <div class="p-8 text-center text-slate-400 italic">ไม่มีงานที่ได้รับมอบหมายในขณะนี้</div>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="grid grid-cols-1 gap-3">
      <button onclick="openChatModal()" class="flex items-center justify-between bg-white p-5 rounded-2xl border border-slate-200 shadow-sm active:bg-slate-50">
        <div class="flex items-center gap-4">
          <div class="w-12 h-12 bg-purple-100 text-purple-600 rounded-xl flex items-center justify-center text-xl relative">
            <i class="fas fa-comment-dots"></i>
            <span id="chat-badge" class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center hidden">0</span>
          </div>
          <div class="text-left">
            <p class="font-bold text-slate-800 kanit">ข้อความด่วน (Chat)</p>
            <p class="text-xs text-slate-400">คุยกับฝ่าย CS / ออฟฟิศ</p>
          </div>
        </div>
        <i class="fas fa-chevron-right text-slate-300"></i>
      </button>

      <button onclick="openAdditionalWorkModal()" class="flex items-center justify-between bg-white p-5 rounded-2xl border border-slate-200 shadow-sm active:bg-slate-50">
        <div class="flex items-center gap-4">
          <div class="w-12 h-12 bg-yellow-100 text-yellow-600 rounded-xl flex items-center justify-center text-xl">
            <i class="fas fa-plus-circle"></i>
          </div>
          <div class="text-left">
            <p class="font-bold text-slate-800 kanit">รายงานงานเพิ่ม</p>
            <p class="text-xs text-slate-400">แจ้งงานพิเศษ/ค่าใช้จ่ายเพิ่มเติม</p>
          </div>
        </div>
        <i class="fas fa-chevron-right text-slate-300"></i>
      </button>

      <button onclick="openFuelModal()" class="flex items-center justify-between bg-white p-5 rounded-2xl border border-slate-200 shadow-sm active:bg-slate-50">
        <div class="flex items-center gap-4">
          <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-xl flex items-center justify-center text-xl"><i class="fas fa-gas-pump"></i></div>
          <div class="text-left">
            <p class="font-bold text-slate-800 kanit">บันทึกค่าน้ำมัน</p>
            <p class="text-xs text-slate-400">กรอกเลขไมล์และจำนวนลิตร</p>
          </div>
        </div>
        <i class="fas fa-chevron-right text-slate-300"></i>
      </button>

      <button onclick="openRepairModal()" class="flex items-center justify-between bg-white p-5 rounded-2xl border border-slate-200 shadow-sm active:bg-slate-50">
        <div class="flex items-center gap-4">
          <div class="w-12 h-12 bg-red-100 text-red-600 rounded-xl flex items-center justify-center text-xl"><i class="fas fa-tools"></i></div>
          <div class="text-left">
            <p class="font-bold text-slate-800 kanit">แจ้งซ่อมรถ</p>
            <p class="text-xs text-slate-400">รายงานปัญหาเครื่องยนต์/ตัวรถ</p>
          </div>
        </div>
        <i class="fas fa-chevron-right text-slate-300"></i>
      </button>
    </div>

    <!-- Repair List -->
    <div>
      <h3 class="font-bold text-slate-800 mb-3 flex items-center gap-2">
        <i class="fas fa-history text-slate-400"></i> ประวัติการแจ้งซ่อม
      </h3>
      <div id="repair-list" class="space-y-3">
        <!-- JS Rendered -->
      </div>
    </div>

    <!-- Additional Work List -->
    <div>
      <h3 class="font-bold text-slate-800 mb-3 flex items-center gap-2">
        <i class="fas fa-list-alt text-slate-400"></i> ประวัติงานเพิ่มที่รายงาน
      </h3>
      <div id="additional-work-list" class="space-y-3">
        <!-- JS Rendered -->
      </div>
    </div>
  </div>

  <!-- Fuel Modal -->
  <div id="fuelModal" class="fixed inset-0 bg-black/50 z-[100] hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl w-full max-w-sm p-6">
      <h3 class="text-xl font-bold kanit mb-4">บันทึกการเติมน้ำมัน</h3>
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">เลขไมล์ปัจจุบัน</label>
          <input type="number" id="fuel-odo" class="w-full border-2 rounded-xl px-4 py-3" placeholder="000000">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">จำนวนลิตร</label>
          <input type="number" id="fuel-liters" class="w-full border-2 rounded-xl px-4 py-3" placeholder="0.00">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">ชื่อปั๊ม / สถานที่</label>
          <input type="text" id="fuel-station" class="w-full border-2 rounded-xl px-4 py-3" placeholder="ปตท. สาขา...">
        </div>
      </div>
      <div class="flex gap-3 mt-6">
        <button onclick="closeFuelModal()" class="flex-1 py-3 font-bold text-slate-500">ยกเลิก</button>
        <button onclick="submitFuel()" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold shadow-lg">บันทึก</button>
      </div>
    </div>
  </div>

  <!-- Repair Modal -->
  <div id="repairModal" class="fixed inset-0 bg-black/50 z-[100] hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl w-full max-w-sm p-6 overflow-y-auto max-h-[90vh]">
      <h3 class="text-xl font-bold kanit mb-4">แจ้งซ่อมรถ</h3>
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">เลขทะเบียนรถ</label>
          <input type="text" id="repair-plate" class="w-full border-2 rounded-xl px-4 py-3" placeholder="กข-1234">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">ประเภทปัญหา</label>
          <select id="repair-type" class="w-full border-2 rounded-xl px-4 py-3">
            <option value="เครื่องยนต์">เครื่องยนต์</option>
            <option value="ยาง / ช่วงล่าง">ยาง / ช่วงล่าง</option>
            <option value="ระบบไฟ">ระบบไฟ</option>
            <option value="อื่นๆ">อื่นๆ</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">ความเร่งด่วน</label>
          <select id="repair-priority" class="w-full border-2 rounded-xl px-4 py-3">
            <option value="low">🟢 ต่ำ (ยังขับได้)</option>
            <option value="medium">🟡 กลาง (ภายใน 3 วัน)</option>
            <option value="high">🔴 สูง (หยุดทำงาน)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">รายละเอียดอาการ</label>
          <textarea id="repair-desc" class="w-full border-2 rounded-xl px-4 py-3" rows="3" placeholder="ระบุอาการเบื้องต้น..."></textarea>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">ตำแหน่งที่พบ</label>
          <input type="text" id="repair-loc" class="w-full border-2 rounded-xl px-4 py-3" placeholder="เช่น ล้อหลังซ้าย">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">วันที่พบปัญหา</label>
          <input type="date" id="repair-date" class="w-full border-2 rounded-xl px-4 py-3">
        </div>
      </div>
      <div class="flex gap-3 mt-6">
        <button onclick="closeRepairModal()" class="flex-1 py-3 font-bold text-slate-500">ยกเลิก</button>
        <button onclick="submitRepair()" class="flex-1 bg-red-600 text-white py-3 rounded-xl font-bold shadow-lg">ส่งแจ้งซ่อม</button>
      </div>
    </div>
  </div>

  <!-- Additional Work Modal -->
  <div id="additionalWorkModal" class="fixed inset-0 bg-black/50 z-[100] hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl w-full max-w-sm p-6 overflow-y-auto max-h-[90vh]">
      <h3 class="text-xl font-bold kanit mb-4">รายงานงานเพิ่ม</h3>
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">ประเภทงานเพิ่ม</label>
          <select id="aw-type" class="w-full border-2 rounded-xl px-4 py-3">
            <option value="เวลารอ (Waiting Time)">เวลารอ (Waiting Time)</option>
            <option value="โหลด/ลงของเพิ่ม (Extra Handling)">โหลด/ลงของเพิ่ม (Extra Handling)</option>
            <option value="งานพิเศษ (Special Request)">งานพิเศษ (Special Request)</option>
            <option value="ค่าใช้จ่ายเพิ่มเติม (Extra Expense)">ค่าใช้จ่ายเพิ่มเติม (Extra Expense)</option>
            <option value="อื่นๆ (Other)">อื่นๆ (Other)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">RN ที่เกี่ยวข้อง (ถ้ามี)</label>
          <input type="text" id="aw-job-rn" class="w-full border-2 rounded-xl px-4 py-3" placeholder="เช่น RN202605-001">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">ระยะเวลา/จำนวน (เช่น 2 ชม. / 500 kg)</label>
          <input type="text" id="aw-duration" class="w-full border-2 rounded-xl px-4 py-3" placeholder="เช่น 2 ชั่วโมง / 500 กก.">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">รายละเอียด</label>
          <textarea id="aw-desc" class="w-full border-2 rounded-xl px-4 py-3" rows="3" placeholder="ระบุรายละเอียดงานเพิ่มเติม..."></textarea>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">ค่าใช้จ่าย/ค่าชดเชย (บาท - ประมาณการ)</label>
          <input type="number" id="aw-cost" class="w-full border-2 rounded-xl px-4 py-3" placeholder="0" min="0">
        </div>
      </div>
      <div class="flex gap-3 mt-6">
        <button onclick="closeAdditionalWorkModal()" class="flex-1 py-3 font-bold text-slate-500">ยกเลิก</button>
        <button onclick="submitAdditionalWork()" class="flex-1 bg-yellow-600 text-white py-3 rounded-xl font-bold shadow-lg">ส่งรายงาน</button>
      </div>
    </div>
  </div>

  <!-- Chat Modal -->
  <div id="chatModal" class="fixed inset-0 bg-black/50 z-[100] hidden flex flex-col justify-end">
    <div class="bg-white rounded-t-3xl w-full h-[80vh] flex flex-col overflow-hidden shadow-2xl">
      <div class="p-4 border-b flex justify-between items-center bg-slate-50">
        <h3 class="font-bold kanit">ฝ่ายสนับสนุน (CS Support)</h3>
        <button onclick="closeChatModal()" class="text-slate-400 p-2"><i class="fas fa-times text-xl"></i></button>
      </div>
      <div id="chat-history" class="flex-1 p-4 overflow-y-auto bg-slate-50 flex flex-col gap-3">
        <!-- Messages Rendered here -->
      </div>
      <div class="p-4 bg-white border-t flex gap-2">
        <input type="text" id="chat-input" class="flex-1 border-2 rounded-xl px-4 py-2" placeholder="พิมพ์ข้อความ..." onkeydown="if(event.key==='Enter')sendChatMessage()">
        <button onclick="sendChatMessage()" class="bg-blue-600 text-white w-10 h-10 rounded-full flex items-center justify-center shadow-lg"><i class="fas fa-paper-plane"></i></button>
      </div>
    </div>
  </div>

  <script>
    // Mock data sync with Office
    const loadJobs = () => JSON.parse(localStorage.getItem('mck_jobs') || '[]');
    const saveJobs = (data) => localStorage.setItem('mck_jobs', JSON.stringify(data));
    const loadMessages = () => JSON.parse(localStorage.getItem('mck_messages') || '[]');
    const saveMessages = (d) => localStorage.setItem('mck_messages', JSON.stringify(d));
    const loadCheckins = () => JSON.parse(localStorage.getItem('mck_checkins') || '[]');
    const saveCheckins = (d) => localStorage.setItem('mck_checkins', JSON.stringify(d));
    const loadDriverRepairs = () => JSON.parse(localStorage.getItem('mck_driver_repairs') || '[]');
    const saveDriverRepairs = d => localStorage.setItem('mck_driver_repairs', JSON.stringify(d));
    let currentUser = null;

    function renderCurrentJob() {
      const jobs = loadJobs();
      // ค้นหางานที่ยังไม่สำเร็จ (pending, loading, transit, waiting)
      const activeJob = jobs.find(j => j.status !== 'delivered');
      const container = document.getElementById('job-card');

      if (!activeJob) {
        container.innerHTML = '<div class="p-8 text-center text-slate-400 italic">ไม่มีงานที่ได้รับมอบหมาย</div>';
        document.getElementById('count-jobs').innerText = '0';
        return;
      }

      document.getElementById('count-jobs').innerText = '1';
      
      const statusLabels = {
        'pending': 'รอยืนยัน',
        'loading': 'กำลังขึ้นของ',
        'transit': 'อยู่ระหว่างทาง',
        'waiting': 'รอข้ามด่าน'
      };

      container.innerHTML = `
        <div class="p-6">
          <div class="flex justify-between items-start mb-4">
            <span class="bg-orange-100 text-orange-700 text-xs font-bold px-3 py-1 rounded-full">${statusLabels[activeJob.status] || activeJob.status}</span>
            <span class="text-blue-600 font-bold font-mono text-lg">${activeJob.rn}</span>
          </div>
          <div class="space-y-4">
            <div class="flex items-start gap-3">
              <i class="fas fa-map-marker-alt text-red-500 mt-1"></i>
              <div>
                <p class="text-xs text-slate-400 uppercase font-bold">ต้นทาง (ล้ง)</p>
                <p class="font-semibold text-slate-800">${activeJob.warehouse || 'ไม่ระบุ'}</p>
              </div>
            </div>
            <div class="flex items-start gap-3">
              <i class="fas fa-flag-checkered text-green-500 mt-1"></i>
              <div>
                <p class="text-xs text-slate-400 uppercase font-bold">ปลายทาง (ด่าน)</p>
                <p class="font-semibold text-slate-800">${activeJob.destination || 'ไม่ระบุ'}</p>
              </div>
            </div>
            <div class="grid grid-cols-2 border-t border-dashed pt-4">
              <div>
                <p class="text-xs text-slate-400 font-bold uppercase">เบอร์ตู้</p>
                <p class="font-mono font-bold text-slate-700">${activeJob.container}</p>
              </div>
              <div class="text-right">
                <p class="text-xs text-slate-400 font-bold uppercase">สินค้า</p>
                <p class="text-slate-700">${activeJob.goods || 'ทุเรียน'}</p>
              </div>
            </div>
          </div>
        </div>
        <!-- POD SECTION -->
        <div class="px-6 pb-4" id="pod-ui">
          ${renderPODUI(activeJob)}
        </div>
        <div class="bg-slate-50 p-4 border-t flex gap-2">
          ${renderStatusButtons(activeJob)}
        </div>
      `;
    }

    function renderPODUI(job) {
      if (job.podPhoto) {
        return `
          <div class="relative rounded-2xl overflow-hidden border-2 border-green-500 shadow-sm animate-pulse">
            <img src="${job.podPhoto}" class="w-full h-48 object-cover">
            <div class="absolute inset-x-0 bottom-0 bg-black/60 p-2 text-white text-[10px] font-bold text-center">
              รูปถ่ายหลักฐานบันทึกแล้ว ✓
            </div>
            <button onclick="removePOD('${job.rn}')" class="absolute top-2 right-2 bg-red-500 text-white w-8 h-8 rounded-full flex items-center justify-center shadow-lg">
              <i class="fas fa-times"></i>
            </button>
          </div>
        `;
      }
      return `
        <button onclick="triggerPOD()" class="w-full border-2 border-dashed border-slate-300 rounded-2xl py-6 text-slate-500 flex flex-col items-center gap-2 hover:bg-slate-50 transition active:scale-95">
          <i class="fas fa-camera text-3xl"></i>
          <span class="text-xs font-bold uppercase tracking-wider">ถ่ายรูปหลักฐานการส่งสินค้า (POD)</span>
        </button>
      `;
    }

    function renderStatusButtons(job) {
      if (job.status === 'pending') {
        return `<button onclick="updateJobStatus('${job.rn}', 'loading')" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold">เริ่มโหลดของ</button>`;
      } else if (job.status === 'loading') {
        return `<button onclick="updateJobStatus('${job.rn}', 'transit')" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold">ออกเดินทาง</button>`;
      } else if (job.status === 'transit') {
        return `
          <button onclick="updateJobStatus('${job.rn}', 'waiting')" class="flex-1 bg-yellow-500 text-white py-3 rounded-xl font-bold">ถึงด่าน (รอข้าม)</button>
          <button onclick="updateJobStatus('${job.rn}', 'delivered')" class="flex-1 bg-slate-800 text-white py-3 rounded-xl font-bold">ส่งมอบสำเร็จ</button>
        `;
      } else if (job.status === 'waiting') {
        return `<button onclick="updateJobStatus('${job.rn}', 'delivered')" class="w-full bg-slate-800 text-white py-3 rounded-xl font-bold">ส่งมอบสำเร็จ</button>`;
      }
      return '';
    }

    // POD Functions
    function triggerPOD() {
      document.getElementById('pod-input').click();
    }

    function processPOD(input) {
      const file = input.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const base64 = e.target.result;
        let jobs = loadJobs();
        const activeJob = jobs.find(j => j.status !== 'delivered');
        
        if (activeJob) {
          activeJob.podPhoto = base64;
          // Add timeline entry for tracking
          activeJob.timeline.push({ 
            time: new Date().toLocaleString('th-TH'), 
            title: '📸 แนบรูป POD', 
            desc: 'พนักงานขับรถถ่ายรูปหลักฐานการส่งสินค้าเรียบร้อย', 
            done: true 
          });
          saveJobs(jobs);
          renderCurrentJob();
          alert('บันทึกรูปภาพหลักฐานสำเร็จ!');
        }
      };
      reader.readAsDataURL(file);
    }

    function removePOD(rn) {
      if(!confirm('ต้องการลบรูปหลักฐานนี้เพื่อถ่ายใหม่หรือไม่?')) return;
      let jobs = loadJobs();
      const idx = jobs.findIndex(j => j.rn === rn);
      if (idx !== -1) {
        delete jobs[idx].podPhoto;
        saveJobs(jobs);
        renderCurrentJob();
      }
    }

    // Check-in functions (Simulated GPS)
    function doCheckin() {
      const status = document.getElementById('checkin-status');
      const btn = document.getElementById('btn-checkin');
      
      const lat = (13.7 + Math.random() * 0.1).toFixed(6);
      const lng = (100.5 + Math.random() * 0.1).toFixed(6);
      const timeStr = new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
      
      const log = {
        driver: currentUser.name,
        time: new Date().toLocaleString('th-TH'),
        coords: `${lat}, ${lng}`,
        type: 'Check-in'
      };
      
      const logs = loadCheckins();
      logs.unshift(log);
      saveCheckins(logs);
      
      status.innerHTML = `เช็คอินแล้วเมื่อ ${timeStr} <br><span class="text-[10px] text-slate-400">พิกัด: ${lat}, ${lng}</span>`;
      btn.disabled = true;
      btn.classList.replace('bg-green-600', 'bg-slate-300');
      alert('เช็คอินสำเร็จ!');
    }

    // Chat functions
    function openChatModal() { 
      document.getElementById('chatModal').classList.remove('hidden');
      localStorage.setItem('mck_unread_driver', '0');
      updateDriverBadge();
      renderMessages();
    }
    function closeChatModal() { document.getElementById('chatModal').classList.add('hidden'); }

    function updateDriverBadge() {
      const badge = document.getElementById('chat-badge');
      const unread = parseInt(localStorage.getItem('mck_unread_driver') || '0');
      if (unread > 0) {
        badge.innerText = unread > 99 ? '9+' : unread;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    function renderMessages() {
      const list = document.getElementById('chat-history');
      const msgs = loadMessages();
      list.innerHTML = msgs.map(m => `
        <div class="flex flex-col ${m.sender === currentUser.name ? 'items-end' : 'items-start'}">
          <div class="max-w-[85%] p-3 rounded-2xl ${m.sender === currentUser.name ? 'bg-blue-600 text-white rounded-tr-none' : 'bg-white text-slate-800 border shadow-sm rounded-tl-none'}">
            <p class="text-[9px] opacity-70 mb-1 font-bold">${m.sender === currentUser.name ? 'ฉัน' : m.sender} • ${m.time}</p>
            <p class="text-sm">${m.text}</p>
          </div>
        </div>
      `).join('') || '<div class="text-center text-slate-400 py-10 text-xs italic">ยังไม่มีบทสนทนา</div>';
      list.scrollTop = list.scrollHeight;
    }

    function sendChatMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if(!text) return;
      
      const msgs = loadMessages();
      msgs.push({
        sender: currentUser.name,
        time: new Date().toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'}),
        text: text
      });
      saveMessages(msgs);
      input.value = '';
      renderMessages();
      
      // Notify Office
      const unread = parseInt(localStorage.getItem('mck_unread_office') || '0');
      localStorage.setItem('mck_unread_office', unread + 1);
    }

    // Sync across tabs/windows
    window.addEventListener('storage', (e) => {
      if (e.key === 'mck_messages') {
        renderMessages();
      }
      if (e.key === 'mck_unread_driver') {
        updateDriverBadge();
      }
    });

    function updateJobStatus(rn, newStatus) {
      let jobs = loadJobs();
      const idx = jobs.findIndex(j => j.rn === rn);
      if (idx !== -1) {
        jobs[idx].status = newStatus;
        // เพิ่ม Timeline
        const timeText = new Date().toLocaleString('th-TH');
        const statusText = { 'loading': 'เริ่มบรรทุกสินค้า', 'transit': 'ออกเดินทาง', 'waiting': 'ถึงด่าน/รอคิว', 'delivered': 'ส่งมอบงานสำเร็จ' };
        jobs[idx].timeline.push({ time: timeText, title: statusText[newStatus], desc: 'อัปเดตโดยคนขับผ่าน Mobile Portal', done: true });
        
        saveJobs(jobs);
        renderCurrentJob();
        alert('อัปเดตสถานะเรียบร้อย ฝ่ายออฟฟิศได้รับข้อมูลแล้ว');
      }
    }

    // Modal & Logout functions
    function openFuelModal() { document.getElementById('fuelModal').classList.remove('hidden'); }
    function closeFuelModal() { document.getElementById('fuelModal').classList.add('hidden'); }
    
    function submitFuel() {
      const odo = document.getElementById('fuel-odo').value;
      const lit = document.getElementById('fuel-liters').value;
      if (!odo || !lit) return alert('กรุณากรอกข้อมูลให้ครบ');
      
      // บันทึกลงระบบ Fleet Hub (ผ่าน localStorage ของ fleet-hub)
      alert('บันทึกค่าน้ำมันสำเร็จ! ข้อมูลถูกส่งไปฝ่ายการเงินแล้ว');
      closeFuelModal();
    }

    function logout() {
      sessionStorage.removeItem('mck_user');
      location.href = 'index.html';
    }

    window.onload = () => {
      currentUser = JSON.parse(sessionStorage.getItem('mck_user'));
      // Allow Office staff (Admin, Manager, Boss, CS, Dispatch, Finance, เอกสาร, ช่าง) to view for monitoring
      const officeRoles = ['Admin', 'Manager', 'Boss', 'ประสานงาน', 'เอกสาร', 'Dispatch', 'Finance', 'ช่าง'];
      if (!currentUser || (currentUser.role !== 'Driver' && !officeRoles.includes(currentUser.role))) {
        location.href = 'index.html';
        return;
      }
      document.getElementById('driver-name').innerText = currentUser.name;
      renderCurrentJob();
      renderAdditionalWorkHistory();
      updateDriverBadge();
    };
  </script>
</body>
</html>
